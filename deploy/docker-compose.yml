services:
  qr-sign:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: qr-sign
    restart: unless-stopped
    environment:
      SIGN_BASE: https://courses.example.edu.cn
      SIGN_TARGET: ""
    volumes:
      # 会话文件放宿主机，容器只读挂进来；不要提交到仓库
      - ./data:/app/data:ro
    ports:
      - "127.0.0.1:8080:8080"
